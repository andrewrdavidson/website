name: Build and deploy
env:
  # Define tool versions
  GO_VERSION: 1.27.1
  HUGO_VERSION: 0.167.0
  NODE_VERSION: 24.21.0

  # Set the build time zone
  TZ: Europe/Oslo
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Dart Sass used to be installed here, pinned by a DART_SASS_VERSION variable, for a
      # stylesheet that is plain CSS compiled by Tailwind. Nothing in the repository is .scss or
      # .sass (verified: `find . -name '*.scss' -o -name '*.sass'` outside node_modules is empty),
      # so the download was a minute of every run spent on a binary Hugo is configured not to
      # call — `security.exec.allow` in hugo.toml no longer lists `sass` either. If Sass is ever
      # wanted, add the install step back *and* the allow-list entry, together.

      # The standard archive. The extended edition is *not* required: WebP encoding — the one
      # thing this site could plausibly have needed it for, since the theme's responsive-image
      # partial resizes to WebP — moved into every Hugo edition in v0.153, and the module version
      # check that used to enforce the choice is disabled from v0.153.2. The history here is worth
      # knowing because the first version of this workflow comment claimed the opposite: see the
      # "extended edition" note in docs/BlogIssues-Fixes.md.
      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Build the search index
        run: |
          echo "Building the Pagefind search index..."
          # Search runs client-side and needs an index that only exists after the Hugo build,
          # which is why /search/ is empty without this step. `pagefind` is a devDependency, so
          # npm ci above provides it; `npm run search` runs it over public/ with the same flags
          # and the same --force-language en-GB the tests use, so the two cannot drift.
          npm run search

      - name: Prune the artifact
        run: |
          # Deletes what Hugo copied from the theme's static/ and this site never serves — 6.6 MB
          # of CJK font slices and four unreferenced icons — and fails if the files the site does
          # serve went missing. `npm run build` runs the same script; the flags above are the
          # Pages-specific ones, so the step is spelled out rather than delegated. check-html.mjs
          # (in the test job) fails if any pruned path is back in the artifact.
          npm run prune

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  test:
    # Runs alongside the build rather than after it, so a failing test cannot hold up a deploy that
    # is otherwise fine, and a broken build cannot hide a failing test. It deliberately builds the
    # site a second time: the deploy build above carries the Pages base URL, while these tests need
    # a loopback one, plus drafts (all three series and most posts are drafts, and the series
    # disclosure, the category accordion and pagination all need something to render).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          mkdir -p "${HOME}/.local"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build the site and its search index for testing
        run: |
          # One command, not the four lines it expands to (hugo with drafts and a loopback base URL,
          # then pagefind). `npm run test:prepare` is the recipe tests/global-setup.ts insists on,
          # and running it here rather than retyping it is what stops CI and the suite drifting
          # apart. The port is still set in two places by necessity — that script and the webServer
          # block of playwright.config.ts — so keep those in step.
          npm run test:prepare

      - name: Check the built HTML
        run: npm run check:html

      - name: Install the Playwright browser
        run: npm run test:install:ci

      - name: Run the tests
        run: npm test

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # A pull request builds and tests but never publishes: the Pages environment belongs to main.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
